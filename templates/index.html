<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natu - Gestión de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 30px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">🌿 Natu - Inventario y Ventas</h1>

        <div class="card">
            <div class="card-header bg-primary text-white">Agregar Nuevo Producto</div>
            <div class="card-body">
                <form action="/agregar_producto" method="POST" class="row g-3">
                    <div class="col-md-6">
                        <input type="text" name="nombre" class="form-control" placeholder="Nombre del producto" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio $" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="stock" class="form-control" placeholder="Stock inicial" required>
                    </div>
                    <div class="col-md-6">
                        <select name="es_unidad" class="form-select">
                            <option value="true">Venta por Unidad</option>
                            <option value="false">Venta por Peso (Kg)</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success w-100">Guardar Producto</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-success text-white">Registrar Venta</div>
            <div class="card-body">
                <form action="/venta" method="POST" class="row g-3">
                    <div class="col-md-7">
                        <select name="producto_id" class="form-select" required>
                            <option value="">Seleccionar producto...</option>
                            {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }} - ${{ p.precio_unitario }} (Stock: {{ p.stock_actual }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" name="cantidad" class="form-control" placeholder="Cantidad" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Vender</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header bg-dark text-white">Stock Actual</div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Precio</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in productos %}
                        <tr>
                            <td>{{ p.nombre }}</td>
                            <td>${{ p.precio_unitario }}</td>
                            <td class="{{ 'text-danger' if p.stock_actual <= 0 else '' }}">
                                {{ p.stock_actual }} {{ 'U' if p.es_unidad else 'Kg' }}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
