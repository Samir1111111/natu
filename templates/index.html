<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natu PRO | Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f4f7f6; }
        .glass-card { @apply bg-white p-6 rounded-[2rem] shadow-xl shadow-slate-200/50 border border-slate-100; }
        .input-pro { @apply w-full bg-slate-100 border-none p-4 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none text-slate-700; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-extrabold italic">🌿 Natu<span class="text-green-600">PRO</span></h1>
            <div class="flex gap-4">
                <div class="text-right">
                    <p class="text-xs text-slate-400 font-bold uppercase">Hoy</p>
                    <h2 id="stat_hoy" class="text-2xl font-black text-slate-800">$0</h2>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- SECCIÓN VENTAS -->
            <div class="glass-card space-y-6">
                <h3 class="font-bold text-xl flex items-center gap-2">🛒 Nueva Venta</h3>
                
                <!-- Buscador de productos -->
                <input type="text" id="bus_prod" onkeyup="buscarEnSelector()" placeholder="🔍 Buscar producto..." class="input-pro text-sm border-2 border-green-100 bg-white">
                
                <select id="sel_prod" class="input-pro">
                    <option value="">Seleccionar producto...</option>
                    {% for p in productos %}
                    <option value="{{p.nombre}}">{{p.nombre}} (Stock: {{p.stock_gramos}})</option>
                    {% endfor %}
                </select>

                <input type="number" id="val_cant" placeholder="Cantidad (Gramos o Unidades)" class="input-pro">
                <button onclick="realizarVenta()" class="w-full py-5 bg-green-600 hover:bg-green-700 text-white rounded-3xl font-bold text-xl shadow-lg shadow-green-200 transition-all">Registrar Venta</button>
            </div>

            <!-- SECCIÓN CATÁLOGO -->
            <div class="glass-card space-y-4">
                <h3 class="font-bold text-xl">📦 Cargar Producto / Precios</h3>
                <div class="grid grid-cols-2 gap-3">
                    <input id="cat_nom" placeholder="Nombre del producto" class="col-span-2 input-pro">
                    <input id="cat_100" type="number" placeholder="$ 100g" class="input-pro text-sm">
                    <input id="cat_250" type="number" placeholder="$ 250g" class="input-pro text-sm">
                    <input id="cat_500" type="number" placeholder="$ 500g" class="input-pro text-sm">
                    <input id="cat_1000" type="number" placeholder="$ 1kg / Uni" class="input-pro text-sm">
                    <div class="col-span-2 flex items-center gap-3 p-3 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                        <input type="checkbox" id="cat_uni" class="w-5 h-5 accent-green-600">
                        <label for="cat_uni" class="text-sm font-bold text-slate-500 uppercase italic">Venta por Unidad</label>
                    </div>
                    <button onclick="guardarCatalogo()" class="col-span-1 py-4 bg-slate-800 text-white rounded-2xl font-bold">Guardar</button>
                    <button onclick="reponerStock()" class="col-span-1 py-4 bg-blue-600 text-white rounded-2xl font-bold">Sumar Stock</button>
                </div>
            </div>
        </div>

        <!-- HISTORIAL -->
        <div class="glass-card">
            <h3 class="font-bold text-xl mb-6">📋 Historial de hoy</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-400 text-xs font-bold uppercase border-b">
                            <th class="pb-3">Producto</th>
                            <th class="pb-3">Monto</th>
                            <th class="pb-3 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="lista_historial" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Función para buscar productos en el selector
        function buscarEnSelector() {
            let input = document.getElementById('bus_prod').value.toLowerCase();
            let select = document.getElementById('sel_prod');
            let options = select.options;
            
            for (let i = 1; i < options.length; i++) {
                let txt = options[i].text.toLowerCase();
                options[i].style.display = txt.includes(input) ? "" : "none";
                if (txt.includes(input)) select.selectedIndex = i; // Auto-selecciona el primero que encuentra
            }
        }

        function guardarCatalogo() {
            let f = new FormData();
            f.append('nombre', document.getElementById('cat_nom').value);
            f.append('p100', document.getElementById('cat_100').value || 0);
            f.append('p250', document.getElementById('cat_250').value || 0);
            f.append('p500', document.getElementById('cat_500').value || 0);
            f.append('p1000', document.getElementById('cat_1000').value || 0);
            // El checkbox necesita convertirse a string 'true' o 'false' para que FastAPI lo entienda
            f.append('unidad', document.getElementById('cat_uni').checked ? 'true' : 'false');

            fetch('/add_producto_catalogo', {method:'POST', body:f})
            .then(() => { alert("Producto Guardado"); location.reload(); });
        }

        function realizarVenta() {
            let p = document.getElementById('sel_prod').value;
            let c = document.getElementById('val_cant').value;
            if(!p || !c) return alert("Completa producto y cantidad");

            let f = new FormData();
            f.append('producto', p);
            f.append('cantidad', c);

            fetch('/venta_rapida', {method:'POST', body:f})
            .then(async r => {
                let res = await r.json();
                if(r.ok) location.reload();
                else alert(res.error);
            });
        }

        function reponerStock() {
            let p = document.getElementById('sel_prod').value;
            let c = document.getElementById('val_cant').value;
            if(!p || !c) return alert("Selecciona producto y cantidad a sumar");

            let f = new FormData();
            f.append('producto', p);
            f.append('cantidad', c);

            fetch('/reponer_stock', {method:'POST', body:f}).then(() => location.reload());
        }

        function borrarVenta(id) {
            if(!confirm("¿Borrar venta?")) return;
            let f = new FormData(); f.append('id', id);
            fetch('/borrar_venta', {method:'POST', body:f}).then(() => location.reload());
        }

        // Carga de datos inicial
        window.onload = () => {
            fetch('/dashboard_data').then(r=>r.json()).then(d => {
                document.getElementById('stat_hoy').innerText = `$${d.hoy}`;
            });

            fetch('/historial').then(r=>r.json()).then(d => {
                let html = '';
                d.historial.forEach(v => {
                    html += `<tr>
                        <td class="py-4 font-bold text-slate-700">${v.producto} <span class="text-[10px] text-slate-400 block">${v.cantidad}g/u</span></td>
                        <td class="py-4 text-green-600 font-black">$${v.total}</td>
                        <td class="py-4 text-right"><button onclick="borrarVenta(${v.id})" class="text-red-300 hover:text-red-500 font-bold text-xs">ELIMINAR</button></td>
                    </tr>`;
                });
                document.getElementById('lista_historial').innerHTML = html;
            });
        };
    </script>
</body>
</html>
