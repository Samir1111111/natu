<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natu | Gestión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0fdf4; color: #334155; }
        .glass-card { @apply bg-white/70 backdrop-blur-sm p-6 rounded-[2.5rem] shadow-sm border border-green-100; }
        .btn-pastel-green { @apply bg-[#bbf7d0] hover:bg-[#86efac] text-[#166534] font-bold py-3 px-6 rounded-2xl transition-all active:scale-95; }
        .input-pastel { @apply w-full bg-white border border-green-50 p-3 rounded-xl focus:ring-2 focus:ring-green-200 outline-none; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header con Recaudación -->
        <header class="flex flex-wrap justify-between items-center bg-white/50 p-6 rounded-3xl border border-white gap-4">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight text-[#166534]">Natu<span class="text-[#4ade80]">.</span></h1>
                <p id="reloj" class="text-xs font-bold text-green-600/40 uppercase tracking-widest mt-1"></p>
            </div>
            <div class="bg-green-100/50 px-6 py-3 rounded-2xl border border-green-200">
                <p class="text-[10px] font-black text-green-700 uppercase">Recaudado Hoy</p>
                <h2 id="total_dia" class="text-3xl font-black text-green-800">$0</h2>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- IZQUIERDA: VENTAS Y HISTORIAL -->
            <div class="lg:col-span-2 space-y-8">
                <div class="glass-card">
                    <h2 class="text-xl font-bold mb-6 text-green-800">🌱 Nueva Venta</h2>
                    <div class="flex flex-wrap gap-3 mb-6">
                        <div class="flex-1 min-w-[200px]">
                            <input type="text" id="bus_prod" onkeyup="filtrar()" placeholder="Buscar producto..." class="input-pastel mb-2 shadow-sm">
                            <select id="sel_prod" class="input-pastel font-semibold">
                                <option value="">Seleccionar...</option>
                                {% for p in productos %}
                                <option value="{{p.nombre}}" data-uni="{{p.es_unitario}}">
                                    {{p.nombre}} (Disp: {{p.stock_gramos}}{% if p.es_unitario %}u{% else %}g{% endif %})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="w-32">
                            <input type="number" id="val_cant" placeholder="Cant." class="input-pastel font-bold h-[50px]">
                        </div>
                        <button onclick="addCarrito()" class="btn-pastel-green h-[50px]">Añadir</button>
                    </div>

                    <div class="bg-white/50 rounded-3xl overflow-hidden border border-green-50">
                        <table class="w-full text-left">
                            <tbody id="lista_carrito"></tbody>
                        </table>
                    </div>
                    <button onclick="enviarVenta()" class="w-full mt-6 btn-pastel-green text-lg py-4 shadow-lg shadow-green-200/50">REGISTRAR VENTA</button>
                </div>

                <div class="glass-card">
                    <h2 class="text-xl font-bold mb-6 text-green-800">📋 Historial de Hoy</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <tbody id="lista_historial" class="divide-y divide-green-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- DERECHA: STOCK Y CONFIG -->
            <div class="space-y-8">
                <!-- STOCK CON BOTÓN ELIMINAR -->
                <div class="glass-card bg-green-100/20">
                    <h3 class="font-bold text-green-800 mb-4">📊 Inventario</h3>
                    <div class="space-y-4">
                        {% for p in productos %}
                        <div class="group relative space-y-1">
                            <div class="flex justify-between text-xs font-bold">
                                <span>{{p.nombre}}</span>
                                <div class="flex items-center gap-2">
                                    <span class="{% if p.stock_gramos < 500 %}text-amber-500{% else %}text-green-600{% endif %}">
                                        {{p.stock_gramos}}{% if p.es_unitario %}u{% else %}g{% endif %}
                                    </span>
                                    <button onclick="borrarProd('{{p.nombre}}')" class="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 transition-all">✕</button>
                                </div>
                            </div>
                            <div class="w-full bg-white rounded-full h-1.5">
                                <div class="{% if p.stock_gramos < 500 %}bg-amber-400{% else %}bg-green-400{% endif %} h-1.5 rounded-full" 
                                     style="width: {{ (p.stock_gramos / 5000 * 100) if p.stock_gramos < 5000 else 100 }}%"></div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- CARGA DE MERCADERÍA -->
                <div class="glass-card bg-blue-50/30 border-blue-100">
                    <h3 class="font-bold text-blue-700 mb-4 italic">📦 Cargar Stock</h3>
                    <div class="space-y-3">
                        <select id="rep_prod" class="input-pastel border-blue-100">
                            {% for p in productos %}
                            <option value="{{p.nombre}}">{{p.nombre}}</option>
                            {% endfor %}
                        </select>
                        <input type="number" id="rep_cant" placeholder="Cantidad" class="input-pastel border-blue-100">
                        <button onclick="reponer()" class="w-full bg-blue-100 text-blue-700 py-3 rounded-xl font-bold">Sumar al Stock</button>
                    </div>
                </div>

        <div class="glass-card">
            <h3 class="font-bold mb-4 text-slate-600 text-sm">⚙️ Configurar Catálogo</h3>
            <div class="grid grid-cols-2 gap-2">
                <input id="cat_nom" placeholder="Nombre del producto" class="col-span-2 input-pastel text-sm shadow-sm">
                
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-green-600 ml-2 uppercase">Precio 100g</label>
                    <input id="cat_100" type="number" placeholder="$ 100g" class="input-pastel text-xs">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-green-600 ml-2 uppercase">Precio 250g</label>
                    <input id="cat_250" type="number" placeholder="$ 250g" class="input-pastel text-xs">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-green-600 ml-2 uppercase">Precio 500g</label>
                    <input id="cat_500" type="number" placeholder="$ 500g" class="input-pastel text-xs">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-green-600 ml-2 uppercase">Precio 1kg / Uni</label>
                    <input id="cat_1000" type="number" placeholder="$ 1kg" class="input-pastel text-xs">
                </div>
        
                <div class="col-span-2 flex items-center gap-2 p-3 bg-white/50 rounded-xl border border-green-50 mt-2">
                    <input type="checkbox" id="cat_uni" class="w-4 h-4 accent-green-500"> 
                    <label for="cat_uni" class="text-[10px] font-bold text-slate-400 uppercase cursor-pointer">Es venta por unidad</label>
                </div>
                
                <button onclick="guardarCat()" class="col-span-2 btn-pastel-green text-xs py-4 mt-2">
                    Guardar en Catálogo
                </button>
            </div>
        </div>
    </div>

    <script>
        let carrito = [];

        function filtrar() {
            let q = document.getElementById('bus_prod').value.toLowerCase();
            let sel = document.getElementById('sel_prod');
            for(let o of sel.options) o.style.display = o.text.toLowerCase().includes(q) ? "" : "none";
        }

        function addCarrito() {
            let sel = document.getElementById('sel_prod');
            let n = sel.value;
            let c = document.getElementById('val_cant').value;
            let esUni = sel.options[sel.selectedIndex].getAttribute('data-uni') === 'True';
            if(!n || !c) return;
            carrito.push({nombre: n, cantidad: c, uni: esUni ? 'u' : 'g'});
            renderCarrito();
            document.getElementById('val_cant').value = "";
        }

        function renderCarrito() {
            let h = '';
            carrito.forEach((it, i) => {
                h += `<tr class="border-b border-green-50"><td class="p-4 font-bold text-slate-700">${it.nombre}</td><td class="p-4 text-green-600 font-bold">${it.cantidad}${it.uni}</td><td class="p-4 text-right"><button onclick="carrito.splice(${i},1);renderCarrito()" class="text-red-300">✕</button></td></tr>`;
            });
            document.getElementById('lista_carrito').innerHTML = h;
        }

        async function enviarVenta() {
            if(!carrito.length) return alert("Carrito vacío");
            let f = new FormData(); f.append('carrito', JSON.stringify(carrito));
            await fetch('/venta', {method:'POST', body:f});
            location.reload();
        }

        async function guardarCat() {
        let f = new FormData();
        f.append('nombre', document.getElementById('cat_nom').value);
        f.append('p100', document.getElementById('cat_100').value || 0);
        f.append('p250', document.getElementById('cat_250').value || 0);
        f.append('p500', document.getElementById('cat_500').value || 0);
        f.append('p1000', document.getElementById('cat_1000').value || 0);
        f.append('unidad', document.getElementById('cat_uni').checked);
        
        let r = await fetch('/catalogo', {method:'POST', body:f});
        if(r.ok) {
            alert("Producto actualizado correctamente");
            location.reload();
            }
        }

        async function borrarProd(nombre) {
            if(!confirm(`¿Eliminar ${nombre} del catálogo?`)) return;
            let f = new FormData(); f.append('nombre', nombre);
            await fetch('/borrar_producto', {method:'POST', body:f});
            location.reload();
        }

        async function reponer() {
            let f = new FormData();
            f.append('producto', document.getElementById('rep_prod').value);
            f.append('cantidad', document.getElementById('rep_cant').value);
            await fetch('/reponer', {method:'POST', body:f});
            location.reload();
        }

        async function updateStats() {
        // ... (lo que ya tenías de stats_hoy)
        let r = await fetch('/stats_hoy');
        let d = await r.json();
        document.getElementById('total_dia').innerText = `$${d.total_dia}`;
        
        // Nueva lógica de Historial con ID e Impresión
        let rh = await fetch('/historial');
        let data = await rh.json();
        let h = '';
        data.forEach(v => {
            h += `
            <tr class="border-b border-green-50">
                <td class="py-4 font-black text-green-600/30 text-xs">#${v.id}</td>
                <td class="py-4 text-[10px] text-slate-400 font-bold">${v.fecha_formateada}</td>
                <td class="py-4 font-semibold text-slate-700">${v.items}</td>
                <td class="py-4 font-black text-green-600">$${v.total}</td>
                <td class="py-4 text-right space-x-2">
                    <button onclick="imprimirTicket('${v.id}', '${v.fecha_formateada}', '${v.items}', '${v.total}')" class="text-blue-400 hover:text-blue-600 font-bold text-xs uppercase">Imprimir</button>
                    <button onclick="borrarVenta(${v.id})" class="text-red-200 hover:text-red-400">✕</button>
                </td>
            </tr>`;
        });
        document.getElementById('lista_historial').innerHTML = h;
    }
    
    function imprimirTicket(id, fecha, items, total) {
        // Creamos una ventana temporal para el ticket
        const ventana = window.open('', '_blank', 'height=600,width=400');
        ventana.document.write('<html><head><title>Ticket Natu</title>');
        ventana.document.write('<style>body{font-family:monospace; width: 300px; padding: 20px;} .center{text-align:center;} .total{font-size:1.2em; font-weight:bold;}</style>');
        ventana.document.write('</head><body>');
        ventana.document.write('<h2 class="center">🌿 NATU</h2>');
        ventana.document.write('<p class="center">Ticket N°: ' + id + '<br>' + fecha + '</p>');
        ventana.document.write('<hr>');
        ventana.document.write('<p>' + items.split(', ').join('<br>') + '</p>');
        ventana.document.write('<hr>');
        ventana.document.write('<p class="total">TOTAL: $' + total + '</p>');
        ventana.document.write('<p class="center">¡Gracias por tu compra!</p>');
        ventana.document.write('</body></html>');
        ventana.document.close();
        ventana.print();
    }

        async function borrarVenta(id) {
            if(!confirm("¿Borrar venta?")) return;
            let f = new FormData(); f.append('id', id);
            await fetch('/borrar_venta', {method:'POST', body:f});
            location.reload();
        }

        setInterval(() => document.getElementById('reloj').innerText = new Date().toLocaleString(), 1000);
        window.onload = updateStats;
    </script>
</body>
</html>
