<!DOCTYPE html>
<html>
<head>
<title>Natu PRO</title>
<style>
.low {color:red;font-weight:bold;}
</style>
</head>
<body>

<h1>Dashboard</h1>
<p>Hoy: $<span id="hoy"></span></p>
<p>Mes: $<span id="mes"></span></p>

<h2>Productos</h2>
<select id="prod">
{% for p in productos %}
<option value="{{p[1]}}">
{{p[1]}} - Stock: <span class="{{'low' if p[6]<500 else ''}}">{{p[6]}}g</span>
</option>
{% endfor %}
</select>

<input id="gramos" placeholder="gramos">

<button onclick="add()">Agregar</button>

<h2>Reponer Stock</h2>
<input id="rep_prod" placeholder="producto">
<button onclick="rep(100)">+100g</button>
<button onclick="rep(250)">+250g</button>
<button onclick="rep(500)">+500g</button>
<button onclick="rep(1000)">+1kg</button>

<h2>Movimientos</h2>
<ul id="movs"></ul>

<script>

fetch('/dashboard').then(r=>r.json()).then(d=>{
document.getElementById('hoy').innerText=d.hoy
document.getElementById('mes').innerText=d.mes
})

function add(){
let f=new FormData()
f.append('venta_id',1)
f.append('producto',document.getElementById('prod').value)
f.append('gramos',document.getElementById('gramos').value)

fetch('/agregar_producto',{method:'POST',body:f})
}

function rep(c){
let f=new FormData()
f.append('producto',document.getElementById('rep_prod').value)
f.append('cantidad',c)
fetch('/reponer_stock',{method:'POST',body:f}).then(()=>location.reload())
}

fetch('/movimientos').then(r=>r.json()).then(d=>{
let html=''
d.movimientos.forEach(m=>{
html+=`<li>${m[0]} ${m[1]}g (${m[2]})</li>`
})
document.getElementById('movs').innerHTML=html
})

</script>

</body>
</html>
