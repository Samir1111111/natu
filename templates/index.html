<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Natu - Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="mb-4">🌿 Sistema Natu</h1>
        <div class="row">
            <div class="col-md-4">
                <form action="/agregar_producto" method="POST" class="card p-3 shadow-sm">
                    <h5>Nuevo Producto</h5>
                    <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre" required>
                    <input type="number" step="0.01" name="precio" class="form-control mb-2" placeholder="Precio $" required>
                    <input type="number" step="0.01" name="stock" class="form-control mb-2" placeholder="Stock Inicial" required>
                    <select name="es_unidad" class="form-select mb-3">
                        <option value="true">Por Unidad</option>
                        <option value="false">Por Peso (Kg)</option>
                    </select>
                    <button class="btn btn-success">Guardar</button>
                </form>
            </div>
            <div class="col-md-8">
                <form action="/venta" method="POST" class="card p-3 shadow-sm mb-4">
                    <h5>Registrar Venta</h5>
                    <div class="input-group">
                        <select name="producto_id" class="form-select">
                            {% for p in productos %}
                            <option value="{{ p.id }}">{{ p.nombre }} (${{ p.precio_unitario }})</option>
                            {% endfor %}
                        </select>
                        <input type="number" step="0.01" name="cantidad" class="form-control" placeholder="Cant.">
                        <button class="btn btn-primary">Vender</button>
                    </div>
                </form>
                <table class="table table-white shadow-sm">
                    <thead><tr><th>Producto</th><th>Stock</th><th>Precio</th></tr></thead>
                    <tbody>
                        {% for p in productos %}
                        <tr>
                            <td>{{ p.nombre }}</td>
                            <td>{{ p.stock_actual }} {{ 'u' if p.es_unidad else 'kg' }}</td>
                            <td>${{ p.precio_unitario }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
