<script>
let carrito = [];

function agregarAlCarrito() {
    let p = document.getElementById('sel_prod').value;
    let c = parseInt(document.getElementById('val_cant').value);

    if (!p || !c || c <= 0) {
        alert("Completa producto y cantidad");
        return;
    }

    carrito.push({producto: p, cantidad: c});
    renderCarrito();
    document.getElementById('val_cant').value = "";
}

function renderCarrito() {
    let h = '';
    carrito.forEach((item, i) => {
        h += `
        <tr>
            <td>${item.producto}</td>
            <td>${item.cantidad}</td>
            <td>
                <button onclick="eliminar(${i})">❌</button>
            </td>
        </tr>`;
    });
    document.getElementById('tabla_carrito').innerHTML = h;
}

function eliminar(i){
    carrito.splice(i,1);
    renderCarrito();
}

async function finalizarVenta() {
    if (carrito.length === 0) {
        alert("Carrito vacío");
        return;
    }

    let f = new FormData();
    f.append('carrito', JSON.stringify(carrito));

    let res = await fetch('/registrar_venta_carrito', {
        method: 'POST',
        body: f
    });

    let data = await res.json();

    if(data.error){
        alert(data.error);
        return;
    }

    alert("Venta registrada ✅");
    location.reload();
}

async function reponerStock() {
    let prod = document.getElementById('stock_prod').value;
    let cant = parseInt(document.getElementById('stock_cant').value);

    if (!cant || cant <= 0) {
        alert("Cantidad inválida");
        return;
    }

    let f = new FormData();
    f.append('producto', prod);
    f.append('cantidad', cant);

    await fetch('/reponer_stock', {
        method: 'POST',
        body: f
    });

    alert("Stock actualizado ✅");
    location.reload();
}

async function guardarCatalogo() {
    let f = new FormData();

    f.append('nombre', document.getElementById('cat_nom').value);
    f.append('p100', document.getElementById('cat_100').value || 0);
    f.append('p250', document.getElementById('cat_250').value || 0);
    f.append('p500', document.getElementById('cat_500').value || 0);
    f.append('p1000', document.getElementById('cat_1000').value || 0);
    f.append('unidad', document.getElementById('cat_uni').checked ? 'true' : 'false');

    await fetch('/add_producto_catalogo', {
        method: 'POST',
        body: f
    });

    alert("Producto guardado ✅");
    location.reload();
}
</script>
