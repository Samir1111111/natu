<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natu PRO | Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .card { @apply bg-white p-6 rounded-3xl shadow-sm border border-slate-200; }
        .input-style { @apply w-full p-3 rounded-2xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-green-500 outline-none transition-all; }
    </style>
</head>
<body class="p-4 lg:p-10">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="card bg-green-600 text-white border-none">
                <p class="opacity-80 text-sm">Ventas Hoy</p>
                <h2 id="stat_hoy" class="text-3xl font-bold">$0</h2>
            </div>
            <div class="card">
                <p class="text-slate-500 text-sm">Operaciones</p>
                <h2 id="stat_n" class="text-3xl font-bold text-slate-800">0</h2>
            </div>
            <div class="card">
                <p class="text-slate-500 text-sm">Más Vendido</p>
                <h2 id="stat_top" class="text-xl font-bold text-slate-800 text-ellipsis overflow-hidden">---</h2>
            </div>
            <div id="alerta_stock" class="card border-red-200 bg-red-50 hidden">
                <p class="text-red-600 text-xs font-bold uppercase">⚠️ Stock Bajo</p>
                <p id="bajos_lista" class="text-sm text-red-700 font-medium"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Venta -->
            <div class="card">
                <h3 class="text-lg font-bold mb-4 flex items-center gap-2">🛒 Nueva Venta</h3>
                <div class="space-y-4">
                    <select id="sel_prod" class="input-style">
                        {% for p in productos %}
                        <option value="{{p.nombre}}">{{p.nombre}} (Disp: {{p.stock_gramos}})</option>
                        {% endfor %}
                    </select>
                    <input type="number" id="val_cant" placeholder="Gramos / Unidades" class="input-style">
                    <button onclick="realizarVenta()" class="w-full py-4 bg-green-600 hover:bg-green-700 text-white rounded-2xl font-bold text-lg shadow-lg shadow-green-200 transition-all">Registrar y Descontar</button>
                </div>
            </div>

            <!-- Catálogo -->
            <div class="card">
                <h3 class="text-lg font-bold mb-4">📦 Gestión de Productos</h3>
                <div class="grid grid-cols-2 gap-3">
                    <input id="cat_nom" placeholder="Nombre" class="col-span-2 input-style">
                    <input id="cat_100" type="number" placeholder="$ 100g" class="input-style">
                    <input id="cat_250" type="number" placeholder="$ 250g" class="input-style">
                    <input id="cat_500" type="number" placeholder="$ 500g" class="input-style">
                    <input id="cat_1000" type="number" placeholder="$ 1kg / Uni" class="input-style">
                    <div class="col-span-2 flex items-center gap-2 p-2">
                        <input type="checkbox" id="cat_uni" class="w-5 h-5 text-green-600">
                        <label for="cat_uni" class="text-sm text-slate-600">Es venta por Unidad (No por peso)</label>
                    </div>
                    <button onclick="guardarCatalogo()" class="col-span-2 py-3 bg-slate-800 text-white rounded-xl font-bold">Guardar Producto</button>
                </div>
                <div class="mt-6 pt-6 border-t flex gap-2">
                    <input id="rep_cant" type="number" placeholder="Sumar stock" class="flex-1 input-style text-sm">
                    <button onclick="reponer()" class="px-6 bg-blue-600 text-white rounded-xl font-bold text-sm">Reponer</button>
                </div>
            </div>
        </div>

        <!-- Historial -->
        <div class="card">
            <h3 class="text-lg font-bold mb-4">📋 Historial Reciente</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-slate-400 text-xs uppercase">
                        <tr>
                            <th class="pb-3 px-2">Venta</th>
                            <th class="pb-3">Producto</th>
                            <th class="pb-3">Monto</th>
                            <th class="pb-3 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista_historial" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function refresh() {
            // Stats
            fetch('/dashboard_data').then(r=>r.json()).then(d=>{
                document.getElementById('stat_hoy').innerText = `$${d.hoy}`;
                document.getElementById('stat_n').innerText = d.ventas_n;
                document.getElementById('stat_top').innerText = d.top_prod;
                
                if(d.bajos.length > 0) {
                    document.getElementById('alerta_stock').classList.remove('hidden');
                    document.getElementById('bajos_lista').innerText = d.bajos.map(b => b.nombre).join(', ');
                }
            });

            // Historial
            fetch('/historial').then(r=>r.json()).then(d=>{
                let html = '';
                d.historial.forEach(v => {
                    html += `<tr class="text-sm">
                        <td class="py-4 px-2 text-slate-400 font-mono">#${v.id}</td>
                        <td class="py-4 font-semibold text-slate-700">${v.producto} <span class="text-xs font-normal text-slate-400">(${v.cantidad}g/u)</span></td>
                        <td class="py-4 text-green-600 font-bold">$${v.total}</td>
                        <td class="py-4 text-right">
                            <button onclick="borrarVenta(${v.id})" class="text-red-400 hover:text-red-600">Eliminar</button>
                        </td>
                    </tr>`;
                });
                document.getElementById('lista_historial').innerHTML = html;
            });
        }

        function realizarVenta() {
            let f = new FormData();
            f.append('producto', document.getElementById('sel_prod').value);
            f.append('cantidad', document.getElementById('val_cant').value);
            fetch('/venta_rapida', {method:'POST', body:f}).then(async r => {
                if(!r.ok) { let e = await r.json(); alert(e.error); }
                else location.reload();
            });
        }

        function guardarCatalogo() {
            let f = new FormData();
            f.append('nombre', document.getElementById('cat_nom').value);
            f.append('p100', document.getElementById('cat_100').value);
            f.append('p250', document.getElementById('cat_250').value);
            f.append('p500', document.getElementById('cat_500').value);
            f.append('p1000', document.getElementById('cat_1000').value);
            f.append('unidad', document.getElementById('cat_uni').checked);
            fetch('/add_producto_catalogo', {method:'POST', body:f}).then(()=>location.reload());
        }

        function reponer() {
            let f = new FormData();
            f.append('producto', document.getElementById('sel_prod').value);
            f.append('cantidad', document.getElementById('rep_cant').value);
            fetch('/reponer_stock', {method:'POST', body:f}).then(()=>location.reload());
        }

        function borrarVenta(id) {
            if(!confirm("¿Borrar venta? Se devolverá el stock.")) return;
            let f = new FormData(); f.append('id', id);
            fetch('/borrar_venta', {method:'POST', body:f}).then(()=>location.reload());
        }

        window.onload = refresh;
    </script>
</body>
</html>
