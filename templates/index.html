<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Natu PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<div class="max-w-5xl mx-auto space-y-6">

    <!-- 🛒 CARRITO -->
    <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-bold mb-4">🛒 Nueva Venta</h2>

        <div class="flex gap-2 mb-4">
            <select id="sel_prod" class="border p-2 rounded w-full">
                <option value="">Seleccionar producto</option>
                {% for p in productos %}
                <option value="{{p.nombre}}">
                    {{p.nombre}} (Stock: {{p.stock_gramos}}g)
                </option>
                {% endfor %}
            </select>

            <input type="number" id="val_cant" placeholder="Cantidad (g/u)" class="border p-2 rounded w-40">

            <button onclick="agregarAlCarrito()" class="bg-green-600 text-white px-4 rounded">
                Agregar
            </button>
        </div>

        <table class="w-full text-left border">
            <thead class="bg-gray-200">
                <tr>
                    <th class="p-2">Producto</th>
                    <th class="p-2">Cantidad</th>
                    <th class="p-2"></th>
                </tr>
            </thead>
            <tbody id="tabla_carrito"></tbody>
        </table>

        <button onclick="finalizarVenta()" class="mt-4 w-full bg-green-700 text-white p-3 rounded">
            Finalizar Venta
        </button>
    </div>

    <!-- 📦 STOCK -->
    <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-bold mb-4">📦 Reponer Stock</h2>

        <div class="flex gap-2">
            <select id="stock_prod" class="border p-2 rounded w-full">
                {% for p in productos %}
                <option value="{{p.nombre}}">{{p.nombre}}</option>
                {% endfor %}
            </select>

            <input type="number" id="stock_cant" placeholder="Cantidad" class="border p-2 rounded w-40">

            <button onclick="reponerStock()" class="bg-blue-600 text-white px-4 rounded">
                Reponer
            </button>
        </div>
    </div>

    <!-- ⚙️ PRODUCTOS -->
    <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-bold mb-4">⚙️ Nuevo Producto</h2>

        <div class="grid grid-cols-2 gap-2">
            <input id="cat_nom" placeholder="Nombre" class="border p-2 rounded col-span-2">

            <input id="cat_100" type="number" placeholder="Precio 100g" class="border p-2 rounded">
            <input id="cat_250" type="number" placeholder="Precio 250g" class="border p-2 rounded">
            <input id="cat_500" type="number" placeholder="Precio 500g" class="border p-2 rounded">
            <input id="cat_1000" type="number" placeholder="Precio 1kg / unidad" class="border p-2 rounded">

            <label class="col-span-2 flex items-center gap-2">
                <input type="checkbox" id="cat_uni"> Venta por unidad
            </label>

            <button onclick="guardarCatalogo()" class="bg-black text-white p-3 rounded col-span-2">
                Guardar Producto
            </button>
        </div>
    </div>


    <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-bold mb-4">📊 Historial de Ventas</h2>
    
        <table class="w-full text-sm">
            <thead class="bg-gray-200">
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="historial_tabla"></tbody>
        </table>
    </div>
</div>
<script>
let carrito = [];

function agregarAlCarrito() {
    let p = document.getElementById('sel_prod').value;
    let c = parseInt(document.getElementById('val_cant').value);

    if (!p || !c || c <= 0) {
        alert("Completa producto y cantidad");
        return;
    }

    carrito.push({producto: p, cantidad: c});
    renderCarrito();
    document.getElementById('val_cant').value = "";
}

function renderCarrito() {
    let h = '';
    carrito.forEach((item, i) => {
        h += `
        <tr class="border-t">
            <td class="p-2">${item.producto}</td>
            <td class="p-2">${item.cantidad}</td>
            <td class="p-2">
                <button onclick="eliminar(${i})" class="text-red-500">❌</button>
            </td>
        </tr>`;
    });
    document.getElementById('tabla_carrito').innerHTML = h;
}

function eliminar(i){
    carrito.splice(i,1);
    renderCarrito();
}

async function finalizarVenta() {
    if (carrito.length === 0) {
        alert("Carrito vacío");
        return;
    }

    let f = new FormData();
    f.append('carrito', JSON.stringify(carrito));

    let res = await fetch('/registrar_venta_carrito', {
        method: 'POST',
        body: f
    });

    let data = await res.json();

    if(data.error){
        alert(data.error);
        return;
    }

    alert("Venta registrada ✅");
    location.reload();
}

async function reponerStock() {
    let prod = document.getElementById('stock_prod').value;
    let cant = parseInt(document.getElementById('stock_cant').value);

    if (!cant || cant <= 0) {
        alert("Cantidad inválida");
        return;
    }

    let f = new FormData();
    f.append('producto', prod);
    f.append('cantidad', cant);

    await fetch('/reponer_stock', {
        method: 'POST',
        body: f
    });

    alert("Stock actualizado ✅");
    location.reload();
}

async function guardarCatalogo() {
    let f = new FormData();

    f.append('nombre', document.getElementById('cat_nom').value);
    f.append('p100', document.getElementById('cat_100').value || 0);
    f.append('p250', document.getElementById('cat_250').value || 0);
    f.append('p500', document.getElementById('cat_500').value || 0);
    f.append('p1000', document.getElementById('cat_1000').value || 0);
    f.append('unidad', document.getElementById('cat_uni').checked ? 'true' : 'false');

    await fetch('/add_producto_catalogo', {
        method: 'POST',
        body: f
    });

    alert("Producto guardado ✅");
    location.reload();
}

async function cargarHistorial(){
    let res = await fetch('/historial');
    let data = await res.json();

    let h = '';
    data.forEach(v => {
        h += `
        <tr class="border-t">
            <td>${v.id}</td>
            <td>${new Date(v.fecha).toLocaleString()}</td>
            <td>$${v.total}</td>
            <td>
                <button onclick="verTicket(${v.id})" class="text-blue-500">🧾</button>
                <button onclick="borrarVenta(${v.id})" class="text-red-500">❌</button>
            </td>
        </tr>`;
    });

    document.getElementById('historial_tabla').innerHTML = h;
}

async function borrarVenta(id){
    if(!confirm("Borrar venta?")) return;

    let f = new FormData();
    f.append('id', id);

    await fetch('/borrar_venta', {
        method: 'POST',
        body: f
    });

    location.reload();
}

async function verTicket(id){
    let res = await fetch('/ticket/' + id);
    let data = await res.json();

    let txt = `🧾 TICKET\n\n`;
    data.items.forEach(i => {
        txt += `${i.producto} - ${i.cantidad} - $${i.subtotal}\n`;
    });

    txt += `\nTOTAL: $${data.venta.total}`;

    alert(txt);
}

// cargar historial al iniciar
cargarHistorial();
</script>

</body>
</html>
