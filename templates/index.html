<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Natu - Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="text-center mb-4">🌿 Sistema Natu</h1>

        <div class="row">
            <div class="col-md-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">Nuevo Producto</div>
                    <div class="card-body">
                        <form action="/agregar_producto" method="POST">
                            <input type="text" name="nombre" class="form-control mb-2" placeholder="Nombre" required>
                            <input type="number" step="0.01" name="precio" class="form-control mb-2" placeholder="Precio $" required>
                            <input type="number" step="0.01" name="stock" class="form-control mb-2" placeholder="Stock inicial" required>
                            <select name="es_unidad" class="form-select mb-3">
                                <option value="true">Por Unidad</option>
                                <option value="false">Por Peso (Kg)</option>
                            </select>
                            <button class="btn btn-success w-100">Guardar</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">Registrar Venta</div>
                    <div class="card-body">
                        <form action="/venta" method="POST" class="row g-2">
                            <div class="col-8">
                                <select name="producto_id" class="form-select" required>
                                    {% for p in productos %}
                                    <option value="{{ p.id }}">{{ p.nombre }} (${{ p.precio_unitario }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-4">
                                <input type="number" step="0.01" name="cantidad" class="form-control" placeholder="Cant." required>
                            </div>
                            <button class="btn btn-primary mt-2">Vender</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Producto</th>
                                    <th>Stock</th>
                                    <th>Precio</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for p in productos %}
                                <tr>
                                    <td>{{ p.nombre }}</td>
                                    <td>{{ p.stock_actual }} {{ 'u' if p.es_unidad else 'kg' }}</td>
                                    <td>${{ p.precio_unitario }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
