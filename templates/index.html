<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natu - Gestión de Stock y Ventas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #fdfaf5; color: #4a4a4a; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border-left: 5px solid #7ea04d; }
        .low-stock { color: #e74c3c; font-weight: bold; }
        .unit-badge { font-size: 10px; background: #eee; padding: 2px 5px; border-radius: 4px; }
        h1, h2 { color: #5c7a33; margin-top: 0; }
        input, button, select { padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { cursor: pointer; background: #7ea04d; color: white; border: none; font-weight: 600; width: 100%; max-width: 250px; }
        button:hover { background: #6a8841; }
        .btn-blue { background: #4a90e2; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="card">
        <h1>🌿 Natu - Inventario</h1>
        <div class="grid">
            <div>
                <h3>Nuevo Producto / Precio</h3>
                <form id="form_catalogo">
                    <input type="text" name="nombre" placeholder="Nombre (Nuez, Mermelada...)" required><br>
                    <input type="number" step="0.01" name="precio" placeholder="Precio ($)" required>
                    <select name="es_unidad">
                        <option value="false">Venta por Peso (Precio x KG)</option>
                        <option value="true">Venta por Unidad (Precio Unitario)</option>
                    </select><br>
                    <input type="number" step="0.1" name="stock" placeholder="Stock Inicial" required>
                    <input type="number" step="0.1" name="stock_min" placeholder="Stock Mínimo (Alerta)" required>
                    <button type="submit">Guardar en Catálogo</button>
                </form>
            </div>
            <div>
                <h3>Stock Actual</h3>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table>
                        {% for p in productos %}
                        <tr class="{{ 'low-stock' if p[3] <= p[4] else '' }}">
                            <td>{{ p[1] }}</td>
                            <td>{{ p[3] }} {{ 'un' if p[5] else 'g/kg' }}</td>
                            <td><button onclick="reponer({{ p[0] }})" style="padding: 5px; font-size: 12px; width: auto;">+ Stock</button></td>
                        </tr>
                        {% endfor %}
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Nueva Venta</h2>
        <button onclick="crearVenta()">+ Iniciar Venta</button>
        <p>Venta Activa ID: <span id="disp_id">---</span></p>
        <div id="zona_carga" style="display:none;">
            <select id="sel_prod">
                {% for p in productos %}
                <option value="{{ p[1] }}" data-unidad="{{ 'u' if p[5] else 'g' }}">{{ p[1] }}</option>
                {% endfor %}
            </select>
            <input type="number" id="in_cant" placeholder="Cantidad (g o un)">
            <button onclick="agregarItem()" class="btn-blue">Agregar</button>
            <ul id="lista_prev"></ul>
            <button onclick="finalizarVenta()">Finalizar Venta</button>
        </div>
    </div>

    <div class="card">
        <h2>Últimas Ventas</h2>
        <table id="tabla_ventas"></table>
    </div>

<script>
    let current_id = null;

    function reponer(id) {
        let cant = prompt("¿Cuánto stock vas a agregar?");
        if(cant) {
            let f = new FormData(); f.append('producto_id', id); f.append('cantidad', cant);
            fetch('/reponer_stock', {method:'POST', body:f}).then(() => location.reload());
        }
    }

    function crearVenta() {
        fetch('/nueva_venta').then(res => res.json()).then(data => {
            current_id = data.venta_id;
            document.getElementById('disp_id').innerText = current_id;
            document.getElementById('zona_carga').style.display = 'block';
            document.getElementById('lista_prev').innerHTML = '';
        });
    }

    function agregarItem() {
        let f = new FormData();
        f.append('venta_id', current_id);
        f.append('producto', document.getElementById('sel_prod').value);
        f.append('cantidad', document.getElementById('in_cant').value);

        fetch('/agregar_producto', {method:'POST', body:f}).then(res => res.json()).then(data => {
            let li = document.createElement('li');
            li.innerText = `${document.getElementById('sel_prod').value} added ($${data.subtotal.toFixed(2)})`;
            document.getElementById('lista_prev').appendChild(li);
        });
    }

    function finalizarVenta() {
        let f = new FormData(); f.append('venta_id', current_id);
        fetch('/finalizar_venta', {method:'POST', body:f}).then(() => {
            alert("Venta finalizada");
            location.reload();
        });
    }

    function cargarVentas() {
        fetch('/ventas').then(res => res.json()).then(data => {
            let html = '';
            data.ventas.forEach(v => {
                html += `<tr><td>#${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td><b>$${v[3]}</b></td></tr>`;
            });
            document.getElementById('tabla_ventas').innerHTML = html;
        });
    }

    document.getElementById('form_catalogo').onsubmit = function(e) {
        e.preventDefault();
        fetch('/agregar_producto_catalogo', {method: 'POST', body: new FormData(this)})
        .then(() => location.reload());
    }

    window.onload = cargarVentas;
</script>
</body>
</html>
